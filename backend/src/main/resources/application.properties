spring.application.name=webbanve
# Render/Railway truyen cong qua bien PORT
server.port=${PORT:8080}

# Moi gia tri bi mat/thay doi theo moi truong deu doc tu bien moi truong, mac dinh la cau hinh chay local.
# Local: dat mat khau DB va key TMDB trong secrets.properties (da .gitignore)
spring.config.import=optional:file:./secrets.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movie_ticket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# Goi free cua DB gioi han so ket noi
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Seed du lieu demo (phim TMDB, rap, suat chieu, user, don)
app.seed.demo=${SEED_DEMO:true}
tmdb.api-key=${TMDB_API_KEY:}

# Cac domain FE duoc goi API (cach nhau bang dau phay)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

jwt.secret=${JWT_SECRET:ThisIsADevSecretKeyForJwtChangeItInProductionPlease0123456789abcd}
jwt.expiration-ms=86400000
