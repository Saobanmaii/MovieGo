<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg-page);font-family:var(--font-body);color:var(--text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.n{font:600 12px/1.3 var(--font-body);margin-top:8px}.v{font:400 11px/1.3 var(--font-mono);color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--success)"></div><div class="n">success</div><div class="v">#2FBF71</div></div><div class="sw"><div class="chip" style="background:var(--warning)"></div><div class="n">warning</div><div class="v">#F59E0B</div></div><div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="n">danger</div><div class="v">#EF4A51</div></div><div class="sw"><div class="chip" style="background:var(--info)"></div><div class="n">info</div><div class="v">#2BB3C0</div></div><div class="sw"><div class="chip" style="background:var(--success-soft)"></div><div class="n">success-soft</div><div class="v">#0D2A1B</div></div><div class="sw"><div class="chip" style="background:var(--warning-soft)"></div><div class="n">warning-soft</div><div class="v">#30210A</div></div><div class="sw"><div class="chip" style="background:var(--danger-soft)"></div><div class="n">danger-soft</div><div class="v">#3A0E11</div></div><div class="sw"><div class="chip" style="background:var(--info-soft)"></div><div class="n">info-soft</div><div class="v">#0C2B2E</div></div></div></body></html>
