<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg-page);font-family:var(--font-body);color:var(--text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.n{font:600 12px/1.3 var(--font-body);margin-top:8px}.v{font:400 11px/1.3 var(--font-mono);color:var(--text-tertiary)}</style></head><body><div class="row" style="gap:24px;padding:10px 6px"><div class="sw"><div style="height:70px;border-radius:var(--radius-md);box-shadow:var(--shadow-md);background:var(--surface-2)"></div><div class="n">shadow-md</div></div><div class="sw"><div style="height:70px;border-radius:var(--radius-md);box-shadow:var(--shadow-poster);background:var(--surface-3)"></div><div class="n">shadow-poster</div></div><div class="sw"><div style="height:70px;border-radius:var(--radius-md);box-shadow:var(--shadow-overlay);background:var(--surface-raised)"></div><div class="n">shadow-overlay</div></div><div class="sw"><div style="height:70px;border-radius:var(--radius-md);box-shadow:var(--glow-accent);background:var(--red-500)"></div><div class="n">glow-accent</div></div><div class="sw"><div style="height:70px;border-radius:var(--radius-md);box-shadow:var(--ring-focus);background:var(--surface-2)"></div><div class="n">ring-focus</div></div></div></body></html>
