<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Ease-out for UI, spring for seat pick" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg-page);font-family:var(--font-body);color:var(--text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.n{font:600 12px/1.3 var(--font-body);margin-top:8px}.v{font:400 11px/1.3 var(--font-mono);color:var(--text-tertiary)}</style></head><body><style>.t{height:10px;width:30px;border-radius:5px;background:var(--red-500);animation:m 1.6s infinite alternate}@keyframes m{to{transform:translateX(220px)}}</style><div style="display:flex;align-items:center;gap:16px;padding:6px 0"><span class="v" style="width:170px">--ease-out · 200ms</span><div style="width:260px;border-bottom:1px dashed var(--border-default)"><div class="t" style="animation-timing-function:cubic-bezier(.2,.8,.2,1)"></div></div></div><div style="display:flex;align-items:center;gap:16px;padding:6px 0"><span class="v" style="width:170px">--ease-in-out · 320ms</span><div style="width:260px;border-bottom:1px dashed var(--border-default)"><div class="t" style="animation-timing-function:cubic-bezier(.65,0,.35,1)"></div></div></div><div style="display:flex;align-items:center;gap:16px;padding:6px 0"><span class="v" style="width:170px">--ease-spring · 200ms</span><div style="width:260px;border-bottom:1px dashed var(--border-default)"><div class="t" style="animation-timing-function:cubic-bezier(.34,1.56,.64,1)"></div></div></div></body></html>
