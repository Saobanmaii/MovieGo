<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg-page);font-family:var(--font-body);color:var(--text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.n{font:600 12px/1.3 var(--font-body);margin-top:8px}.v{font:400 11px/1.3 var(--font-mono);color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--black)"></div><div class="n">black</div><div class="v">#000000</div></div><div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="n">ink-900</div><div class="v">#0B0B0E</div></div><div class="sw"><div class="chip" style="background:var(--ink-850)"></div><div class="n">ink-850</div><div class="v">#111115</div></div><div class="sw"><div class="chip" style="background:var(--ink-800)"></div><div class="n">ink-800</div><div class="v">#17171C</div></div><div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="n">ink-700</div><div class="v">#212128</div></div><div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="n">ink-500</div><div class="v">#3D3D48</div></div><div class="sw"><div class="chip" style="background:var(--ink-300)"></div><div class="n">ink-300</div><div class="v">#8A8A96</div></div><div class="sw"><div class="chip" style="background:var(--ink-200)"></div><div class="n">ink-200</div><div class="v">#B4B4BE</div></div><div class="sw"><div class="chip" style="background:var(--white)"></div><div class="n">white</div><div class="v">#FFFFFF</div></div></div></body></html>
