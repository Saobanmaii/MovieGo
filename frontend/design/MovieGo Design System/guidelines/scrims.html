<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg-page);font-family:var(--font-body);color:var(--text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.n{font:600 12px/1.3 var(--font-body);margin-top:8px}.v{font:400 11px/1.3 var(--font-mono);color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw"><div style="height:120px;border-radius:var(--radius-lg);background:#2a3442;position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:var(--scrim-hero)"></div><div style="position:absolute;left:14px;bottom:14px;font:800 20px var(--font-display);text-transform:uppercase">Hero scrim</div></div><div class="v" style="margin-top:6px">--scrim-hero</div></div><div class="sw"><div style="height:120px;border-radius:var(--radius-lg);background:#43303a;position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:var(--scrim-poster)"></div><div style="position:absolute;left:14px;bottom:14px;font:700 15px var(--font-display)">Poster scrim</div></div><div class="v" style="margin-top:6px">--scrim-poster</div></div><div class="sw"><div style="height:120px;border-radius:var(--radius-lg);background:var(--haze-red),var(--black);border:1px solid var(--border-subtle)"></div><div class="v" style="margin-top:6px">--haze-red (page ambience)</div></div></div></body></html>
