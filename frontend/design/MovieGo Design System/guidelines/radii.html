<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg-page);font-family:var(--font-body);color:var(--text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.n{font:600 12px/1.3 var(--font-body);margin-top:8px}.v{font:400 11px/1.3 var(--font-mono);color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw"><div style="height:64px;background:var(--surface-3);border:1px solid var(--border-default);border-radius:var(--radius-xs)"></div><div class="n">radius-xs</div><div class="v">4px</div></div><div class="sw"><div style="height:64px;background:var(--surface-3);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div><div class="n">radius-sm</div><div class="v">6px</div></div><div class="sw"><div style="height:64px;background:var(--surface-3);border:1px solid var(--border-default);border-radius:var(--radius-md)"></div><div class="n">radius-md</div><div class="v">10px</div></div><div class="sw"><div style="height:64px;background:var(--surface-3);border:1px solid var(--border-default);border-radius:var(--radius-lg)"></div><div class="n">radius-lg</div><div class="v">14px</div></div><div class="sw"><div style="height:64px;background:var(--surface-3);border:1px solid var(--border-default);border-radius:var(--radius-xl)"></div><div class="n">radius-xl</div><div class="v">20px</div></div><div class="sw"><div style="height:64px;background:var(--surface-3);border:1px solid var(--border-default);border-radius:var(--radius-pill)"></div><div class="n">radius-pill</div><div class="v">999px</div></div></div></body></html>
