<!-- @dsCard group="Colors" viewport="700x130" name="Seat states" subtitle="Seat-map colour language" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--bg-page);font-family:var(--font-body);color:var(--text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:70px}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.n{font:600 12px/1.3 var(--font-body);margin-top:8px}.v{font:400 11px/1.3 var(--font-mono);color:var(--text-tertiary)}</style></head><body><div class="row" style="align-items:center;gap:28px"><div style="display:flex;align-items:center;gap:10px"><div style="width:28px;height:28px;border-radius:var(--seat-radius);background:var(--seat-available);border:1px solid var(--seat-available-border)"></div><span style="font:500 13px var(--font-body);color:var(--text-secondary)">Available</span></div><div style="display:flex;align-items:center;gap:10px"><div style="width:28px;height:28px;border-radius:var(--seat-radius);background:var(--seat-selected);box-shadow:var(--glow-accent)"></div><span style="font:500 13px var(--font-body);color:var(--text-secondary)">Selected</span></div><div style="display:flex;align-items:center;gap:10px"><div style="width:28px;height:28px;border-radius:var(--seat-radius);background:var(--seat-taken);border:1px solid var(--seat-taken-border)"></div><span style="font:500 13px var(--font-body);color:var(--text-secondary)">Taken</span></div><div style="display:flex;align-items:center;gap:10px"><div style="width:28px;height:28px;border-radius:var(--seat-radius);background:transparent;border:1.5px solid var(--seat-vip)"></div><span style="font:500 13px var(--font-body);color:var(--text-secondary)">VIP</span></div><div style="display:flex;align-items:center;gap:10px"><div style="width:28px;height:28px;border-radius:var(--seat-radius);background:transparent;border:1.5px solid var(--seat-accessible)"></div><span style="font:500 13px var(--font-body);color:var(--text-secondary)">Accessible</span></div></div></body></html>
