<!-- @dsCard group="UI kit — Web app" viewport="1280x800" name="Customer booking app" subtitle="Home / showtimes → movie → seats → payment → confirmation → bookings" -->
<!doctype html><html><head><meta charset="utf-8"><title>MovieGo — Web app</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script></head><body>
<div id="root"></div>
<script type="text/babel" src="Backdrop.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="MovieDetail.jsx"></script>
<script type="text/babel" src="SeatSelect.jsx"></script>
<script type="text/babel" src="Payment.jsx"></script>
<script type="text/babel" src="Confirmation.jsx"></script>
<script type="text/babel" src="Bookings.jsx"></script>
<script type="text/babel" src="ShowtimesBrowse.jsx"></script>
<script type="text/babel">
function App(){
  const [route,setRoute]=React.useState(()=>{try{return JSON.parse(localStorage.getItem('mg-web-route'))||{name:'home'}}catch(e){return {name:'home'}}});
  const go=r=>{setRoute(r);localStorage.setItem('mg-web-route',JSON.stringify(r));window.scrollTo(0,0);};
  const S={home:Home,movie:MovieDetail,seats:SeatSelect,pay:Payment,done:Confirmation,bookings:Bookings,showtimes:ShowtimesBrowse}[route.name]||Home;
  const flow=['seats','pay','done'].includes(route.name);
  return <div style={{minHeight:'100vh',position:'relative'}}>{!flow&&<Header route={route} go={go}/>}<S {...route} go={go}/></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
