<script type="text/babel">
const show={cinema:'MovieGo Central',time:'19:45',fmt:'IMAX'};
const routes={home:{name:'home'},movie:{name:'movie',id:'night-shift'},seats:{name:'seats',id:'night-shift',show},pay:{name:'pay',id:'night-shift',show,seats:['F7','F8']},done:{name:'done',id:'night-shift',show,seats:['F7','F8'],total:'$28.50'},bookings:{name:'bookings'}};
const go=()=>{};
function Screen({route}){
  const S={home:Home,movie:MovieDetail,seats:SeatSelect,pay:Payment,done:Confirmation,bookings:Bookings}[route.name];
  const flow=['seats','pay','done'].includes(route.name);
  return <div style={{position:'relative',height:'100%'}}>{!flow&&<Header route={route} go={go}/>}<S {...route} go={go}/></div>;
}
Object.entries(routes).forEach(([k,r])=>ReactDOM.createRoot(document.getElementById('s-'+k)).render(<Screen route={r}/>));
