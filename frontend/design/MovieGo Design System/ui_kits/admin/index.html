<!doctype html><html><head><meta charset="utf-8"><title>MovieGo — Admin</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script></head><body>
<div id="root"></div>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="Movies.jsx"></script>
<script type="text/babel" src="Showtimes.jsx"></script>
<script type="text/babel">
function App(){
  const [page,setPage]=React.useState(()=>localStorage.getItem('mg-admin-page')||'dashboard');
  const go=p=>{setPage(p);localStorage.setItem('mg-admin-page',p);};
  const P={dashboard:Dashboard,movies:Movies,showtimes:Showtimes,cinemas:Cinemas,reports:Reports}[page]||Dashboard;
  return <div style={{display:'flex',minHeight:'100vh'}}><Sidebar page={page} go={go}/><main style={{flex:1,minWidth:0,padding:'32px 40px 64px'}}><P go={go}/></main></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
